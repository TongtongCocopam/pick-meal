name: CI/CD Build

on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    # 테스트에 필요한 외부 인프라
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pickmeal_db
          POSTGRES_USER: pickmeal
          POSTGRES_PASSWORD: pickmeal
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U pickmeal -d pickmeal_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # GitHub 소스 코드 가져오기
      - name: Checkout source code
        uses: actions/checkout@v6
      # Java 설치
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: gradle
      # Linux 환경에서 Gradle Wrapper 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      # PostgreSQL / Redis를 이용한 테스트 실행
      - name: Run tests
        run: ./gradlew test --no-daemon
        env:
          SPRING_PROFILES_ACTIVE: test

          DB_URL: jdbc:postgresql://localhost:5432/pickmeal_db
          DB_USERNAME: pickmeal
          DB_PASSWORD: pickmeal

          REDIS_HOST: localhost
          REDIS_PORT: 6379
      # 테스트 성공 시 Spring Boot JAR 생성
      - name: Build application
        run: ./gradlew bootJar --no-daemon
      # Docker Hub 인증
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Docker 이미지 빌드 및 푸시
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/pickmeal:latest